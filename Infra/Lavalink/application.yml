server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"

  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    sources:
      youtube: false
      local: true
      soundcloud: true
    bufferDurationMs: 400
    playerUpdateInterval: 5

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO

plugins:
  lavasrc:
    # Cadena de resolución de audio:
    # Cuando LavaSrc tiene un track de Spotify/Deezer, intenta encontrar
    # el audio real en este orden (primero por ISRC, luego por nombre).
    providers:
      - "spsearch:%ISRC%"   # 1. Busca en Spotify por código ISRC
      - "dzsearch:%ISRC%"   # 2. Busca en Deezer  por código ISRC
      - "spsearch:%QUERY%"  # 3. Busca en Spotify por nombre/artista
      - "dzsearch:%QUERY%"  # 4. Busca en Deezer  por nombre/artista (fallback final)

    sources:
      spotify: true
      deezer: true

    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:7ca2ed022a7d4f5aaecdf539ac5bbf2b}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:4060766f4cf54dce88a181ddfa2014ae}
      countryCode: "MX"
      playlistLoadLimit: 6
      albumLoadLimit: 6

    deezer:
      # Clave Blowfish que usa Deezer internamente para cifrar el audio.
      # LavaSrc la necesita para descifrar el stream antes de reproducirlo.
      arl: "961a62d724653e69b4d5e052b33a5561ef440fc35252ca49cfe0ba86e04015f0d39b314c1ce600e4d2efb5d837e24c90b1efab3516904ba0d609bc3f063ddb8221faa5499f142103833fec69e7ac7b5ffc96b87a06bced8d91bc04ebdff50298"
      masterDecryptionKey: ${DEEZER_MASTER_KEY:g4el58wc0zvf9na1}